site_name: myaiwouldbemine Copy Learning Hub
site_description: Multi-Disciplinary Code-First Learning Platform
site_url: https://myaiwouldbemine.github.io/myaiwouldbemine-Copy-Learning-Hub/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: 切換至深色模式
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切換至淺色模式

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Operating Systems:
      - subjects/operating-systems/index.md
      - LEC08 (Draft):
          - subjects/operating-systems/lec08/index.md
          - V2 Knowledge Consolidation (Draft): subjects/operating-systems/lec08/V2_LEC08_KNOWLEDGE_CONSOLIDATION.md
          - V3 Code-First Deep Dive (Draft): subjects/operating-systems/lec08/V3_LEC08_CODE_FIRST_DEEP_DIVE.md
          - Review Manifest (Draft): subjects/operating-systems/lec08/REVIEW_MANIFEST.md
  - Preview (DRAFT):
      - LEC08 v4.1 (DRAFT): preview/lec08/index.md
      - LEC09 v4.1 (DRAFT): preview/lec09/index.md
  - Machine Learning: subjects/machine-learning/index.md
  - Deep Learning: subjects/deep-learning/index.md
  - Computer Vision: subjects/computer-vision/index.md
  - Natural Language Processing: subjects/Natural-Language-Processing/index.md
