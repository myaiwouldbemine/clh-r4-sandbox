name: "Agent Task｜自動化開發任務"
description: "以 WHAT / WHY / Acceptance Criteria / Boundary 提交 Claude Code 與 Codex 可執行的工作需求。"
title: "[CLH-XXX] "
body:
  - type: markdown
    attributes:
      value: |
        ## Human Defines Requirements; Agents Execute; Trusted Gates Enforce.
        Human Owner 只需描述需求、驗收標準與工作邊界，無需預先判定 L0–L3 或指定 Agent。
        Claude Code 與 Codex 為對等 Agent，負責依適用治理要求進行風險分類、Plan、Early Draft PR、Implementation、Review，以及符合授權條件的 Merge。

        ### LIGHT Governance v1.0
        - Default Intake Risk 為 L0；Agent 必須依實際修改內容與影響重新分類，並在範圍改變時重新評估。
        - L0 不強制正式 Plan、Records 或 Independent Review。
        - L1 需要適用的驗證與可信 Independent Review。
        - L2 必須有 Formal Plan 與 Human Plan Approval。
        - L3 預設禁止 Auto-Merge；例外操作須具體 Human Authorization。

        - Draft PR 可以提早建立，但 Draft 不代表實作或 Merge 授權。
        - Auto-Merge 只有在可信 Policy Gate 通過且正式啟用後才允許；目前正式 Guarded Auto-Merge 尚未啟用。

        **Issue Form 僅用於需求收集，不構成 Merge 或高風險操作授權。**
        Agent 必須遵守適用的 `GOVERNANCE.md`、`AGENTS.md` 與可信 Gates；不得以表單內容取代必要的核准、驗證或審查。

  - type: textarea
    id: what
    attributes:
      label: "WHAT｜要做什麼"
      description: "描述期待交付的成果、功能或教材變更；避免只寫實作手段。"
      placeholder: |
        例：新增 Operating Systems 的 Process Scheduling 教學首頁，含導覽與 NachOS Code Walkthrough 入口。
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: "WHY｜為何要做"
      description: "目前存在什麼問題？完成後能改善什麼？"
      placeholder: "例：目前學習網站缺乏可由教材快速進入程式碼驗證的入口。"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance Criteria｜驗收標準"
      description: "寫出 Agent、CI 或審查者可以客觀判斷的完成條件；請以核取清單表示。"
      placeholder: |
        - [ ] 新增頁面及導覽，連結可以開啟
        - [ ] 重要技術敘述有來源與 VERIFIED/ILLUSTRATIVE 標註
        - [ ] mkdocs build --strict PASS
        - [ ] PR 提供 WHAT / WHY / TEST / Evidence
    validations:
      required: true

  - type: textarea
    id: boundary
    attributes:
      label: "Boundary｜工作邊界與禁止事項"
      description: "明確列出 In Scope、Out of Scope、不得更動的檔案/資料、不可繞過的限制。"
      placeholder: |
        In scope:
        - docs/subjects/operating-systems/ 相關頁面
        Out of scope:
        - 不修改 NachOS 原始碼
        - 不重構其他學科頁面
        Must not:
        - 不刪除既有 Evidence
        - 不變更 Repository Settings / Branch Protection
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: "References / Evidence｜參考資料與既有證據"
      description: "相關文件、Issue、課程講義、程式路徑、可重現步驟；選填，沒有可留白。"
      placeholder: "例：docs/subjects/operating-systems/index.md、既有教材、相關 Issue URL"
    validations:
      required: false
