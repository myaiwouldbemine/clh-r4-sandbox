name: "Engineering Task｜工程需求"
description: "以 WHAT、WHY、Acceptance Criteria、Boundary 提交 Learning Hub 工作需求。"
title: "[CLH-XXX] "
body:
  - type: markdown
    attributes:
      value: |
        ## Human 定義 WHAT／WHY／DONE；Agent 自主完成工程
        Codex 或 Claude Code 擔任唯一 accountable Builder，負責調查、實作、測試、自審、PR、Merge、適用部署、Evidence 與結案。
        不使用風險分級或重複 Human 工程核准。遵守 CI 與 GitHub 保護，不繞過權限。
        ChatGPT＋Human 保有 V2／V3 教材創作與語義核准；工程僅匯入已核准內容。
        實際自動啟動取決於 Runner 與安裝設定；缺少時明確標記 BLOCKED，不能以 Issue Form 冒充自動化。

  - type: textarea
    id: what
    attributes:
      label: "WHAT｜要做什麼"
      description: "說明預期交付成果。"
      placeholder: "例：忠實匯入已核准的 Process Scheduling 教材並更新導覽。"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: "WHY｜為什麼"
      description: "說明問題和預期改善。"
      placeholder: "例：目前缺少可以由概念連結至實際程式碼的學習入口。"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance Criteria｜驗收標準"
      description: "列出可以客觀核對的完成條件。"
      placeholder: |
        - [ ] 內容與導覽連結可用
        - [ ] 程式碼來源與驗證證據清楚
        - [ ] 適用的 MkDocs strict build 與測試通過
    validations:
      required: true

  - type: textarea
    id: boundary
    attributes:
      label: "Boundary｜工作邊界"
      description: "列出 In Scope、Out of Scope 及禁止更動事項。"
      placeholder: |
        In Scope: 指定學科教材與導覽
        Out of Scope: 其他學科、NachOS 核心原始碼
        Must Not: 自行創作教材語義、繞過保護或直接推送 main
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: "References / Evidence｜參考資料"
      description: "相關教材、Issue、檔案路徑或證據；選填。"
      placeholder: "例：相關 PDF、現有程式碼路徑、參考 PR 連結。"
    validations:
      required: false
