name: Deploy GitHub Pages
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full reviewed merge SHA; must still be main'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  applicability:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python - <<'PYCODE'
          import os, sys
          sys.path.insert(0, 'scripts')
          from autonomous_lifecycle import GitHub, metadata, require, protection
          gh = GitHub(os.environ['GITHUB_REPOSITORY'])
          sha = os.environ['GITHUB_SHA']
          require(sha == os.environ['EXPECTED_SHA'], 'Dispatch SHA changed')
          require(gh.get('git/ref/heads/main')['object']['sha'] == sha, 'Main advanced before deployment')
          protection(gh, deployment=True)
          prs = gh.pages(f'commits/{sha}/pulls')
          applicable = any(p['merged_at'] and p['merge_commit_sha'] == sha and
                           metadata(p['body'])['deployment'] for p in prs)
          require(applicable, 'No merged PR requiring deployment for this SHA')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'deploy={str(applicable).lower()}\n')
          PYCODE
  build:
    needs: applicability
    if: needs.applicability.outputs.deploy == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m mkdocs build --strict
      - name: Bind published content to commit
        run: printf '%s\n' "$GITHUB_SHA" > site/deployment-sha.txt
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read deployed SHA and preserve evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/autonomous_lifecycle.py deployment --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"; then
              exit 0
            fi
            sleep 10
          done
          echo 'BLOCKED: deployment verification failed; Issues remain open'
          exit 1
