name: Autonomous Lifecycle
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows: [Docs Check, Governance Tests, Deploy GitHub Pages]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clh-lifecycle
  cancel-in-progress: false
jobs:
  reconcile:
    if: vars.CLH_AUTONOMY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate and reconcile current GitHub state
        env:
          GH_TOKEN: ${{ secrets.CLH_AUTOMATION_TOKEN }}
          CLH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$GH_TOKEN" || { echo 'BLOCKED: CLH_AUTOMATION_TOKEN missing'; exit 1; }
          python3 scripts/autonomous_lifecycle.py reconcile
